# Builds the tickwork sdist and wheel and uploads them to PyPI on a pushed
# v* tag, using PyPI trusted publishing (OIDC): the upload authenticates via
# the workflow's short-lived id-token, so no PyPI token or secret is stored
# or referenced anywhere. The publish job runs in the `pypi` GitHub
# environment, which requires manual approval on GitHub before the upload
# proceeds (PyPI's trusted publisher is bound to that environment name).
# This file must stay instance-neutral: it must not
# name any host, login, or internal path of the deployment it was generated
# against — those references would dangle for readers outside it.
name: publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    environment: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
